# Official Abstrax Composer plugin.

plugin:
  name: composer
  slug: composer
  display_name: Composer Plugin
  description: Install and manage Composer, and run it with the correct PHP binary
  long_description: |
    The Composer Plugin installs Composer on the server, keeps it up to date,
    and runs it with the correct PHP binary and user. It downloads the stable
    Composer phar from getcomposer.org, verifies the SHA-256 checksum, and
    installs a global wrapper at /usr/local/bin/composer.

    Commands include setup, self-update, remove, status, configure, run,
    diagnose, and auth. PHP is resolved from --php, ABSTRAX_COMPOSER_PHP, the
    project runtime, a server default, then php. Debian/Ubuntu and RHEL-family
    are supported.
  trust_level: official
  status: active
  featured: true
  homepage_url: https://plugins.useabstrax.com/plugins/composer
  repository_url: https://github.com/useabstrax/composer
  documentation_url: https://useabstrax.com/docs/plugins/official/composer
  license: Apache-2.0

publisher:
  name: Abstrax
  slug: useabstrax

